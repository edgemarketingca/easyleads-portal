<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Easyleads · Client console</title>
<link rel="icon" href="../img/easyleads-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--brand:#0086ff;--brand-6:#0074e6;--brand-7:#005fc2;--brand-1:#eef6ff;--brand-2:#dcebff;--ink:#0b0c0f;--ink-2:#30353f;--mute:#677083;--soft:#9aa2b1;--line:#e8eaef;--line-2:#f1f2f5;--bg:#f8f9fb;--card:#fff;--stagebg:#f4f5f8;--ok:#12a26b;--ok-1:#e8f7f0;--bad:#e5484d;--bad-1:#fdeeee;--warn:#c77a0a;--warn-1:#fdf4e4;--r:18px;--sh:0 1px 1px rgba(11,12,15,.03),0 2px 6px -2px rgba(11,12,15,.05);--sh2:0 1px 2px rgba(11,12,15,.04),0 22px 44px -22px rgba(11,12,15,.22);--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:14px/1.5 Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-feature-settings:"cv11","ss01";color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;min-height:100vh}
body:before{content:"";position:fixed;inset:0 0 auto 0;height:420px;background:radial-gradient(60% 100% at 50% 0%,rgba(0,134,255,.07),transparent 70%);pointer-events:none;z-index:0}
#app{position:relative;z-index:1}
button,input,select,textarea{font:inherit;color:inherit}
::selection{background:var(--brand-2)}
code{font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--line-2);padding:1px 6px;border-radius:6px}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:16px;height:64px;padding:0 32px;background:rgba(255,255,255,.82);backdrop-filter:saturate(1.8) blur(16px);border-bottom:1px solid var(--line)}
.top .brand{display:flex;align-items:center;text-decoration:none}
.top .brand img{height:22px;width:auto;display:block}
.top .sub{color:var(--mute);border-left:1px solid var(--line);padding-left:16px;font-weight:500;font-size:13px;display:flex;align-items:center;gap:8px}
.top .sub small{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);font-weight:700;background:var(--line-2);padding:3px 7px;border-radius:6px}
.top .sp{flex:1}
.live{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:500;color:var(--mute)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(18,162,107,.45);animation:ping 2.2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 7px rgba(18,162,107,0)}100%{box-shadow:0 0 0 0 rgba(18,162,107,0)}}

/* ---------- buttons ---------- */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;border:1px solid var(--line);background:#fff;border-radius:11px;padding:0 15px;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--ink);box-shadow:0 1px 2px rgba(11,12,15,.05);transition:transform .18s var(--ease),box-shadow .2s,border-color .2s,background .2s;overflow:hidden;white-space:nowrap}
.btn:hover{border-color:#d6dae2;background:#fcfcfd;box-shadow:0 4px 12px -6px rgba(11,12,15,.16)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 1px 2px rgba(0,80,170,.3),0 8px 18px -10px rgba(0,134,255,.75)}
.btn.pri:hover{background:var(--brand-6);border-color:var(--brand-6);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 1px 2px rgba(0,80,170,.3),0 12px 24px -12px rgba(0,134,255,.85)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.dark:hover{background:#22252c}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{height:32px;padding:0 11px;font-size:12.5px;border-radius:9px}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--mute)}
.btn.ghost:hover{background:var(--line-2);color:var(--ink)}
.btn.icon{width:32px;padding:0}
.btn.bad{color:var(--bad)}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn .rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rip .6s var(--ease);pointer-events:none}
.btn:not(.pri):not(.dark) .rip{background:rgba(11,12,15,.08)}
@keyframes rip{to{transform:scale(4);opacity:0}}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.btn.sm svg.i{width:15px;height:15px}

/* ---------- page ---------- */
main{max-width:1240px;margin:0 auto;padding:44px 32px 90px}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:28px}
.hero .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--brand);letter-spacing:.02em;margin-bottom:10px}
.hero .eyebrow i{width:6px;height:6px;border-radius:50%;background:var(--brand)}
.hero h1{font-size:36px;font-weight:700;letter-spacing:-.035em;margin:0;line-height:1.1}
.hero h1 span{color:var(--brand)}
.hero p{color:var(--mute);margin:10px 0 0;max-width:560px;font-size:14.5px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin:0 0 26px;overflow:hidden}
.stat{position:relative;padding:18px 22px 17px;border-left:1px solid var(--line-2);transition:background .25s}
.stat:first-child{border-left:0}
.stat:hover{background:#fcfcfd}
.stat .l{font-size:12.5px;color:var(--mute);font-weight:500;display:flex;align-items:center;gap:7px}
.stat .l i{width:7px;height:7px;border-radius:2px;background:var(--brand)}
.stat:nth-child(2) .l i{background:var(--ok)}
.stat:nth-child(3) .l i{background:var(--ink)}
.stat:nth-child(4) .l i{background:#7cc0ff}
.stat:nth-child(5) .l i{background:var(--warn)}
.stat .v{font-size:28px;font-weight:650;letter-spacing:-.035em;font-variant-numeric:tabular-nums;margin-top:4px;line-height:1.2}
.stat.warn .v.hot{color:var(--warn)}
.bar{display:flex;gap:12px;margin-bottom:22px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:260px;position:relative}
.search input{width:100%;height:42px;border:1px solid var(--line);border-radius:12px;padding:0 14px 0 40px;background:#fff;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.search input::placeholder{color:var(--soft)}
.search input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px rgba(0,134,255,.12)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--soft)}
.seg{display:flex;background:#eef0f3;border-radius:12px;padding:3px;position:relative;height:42px}
.seg button{position:relative;z-index:1;border:0;background:transparent;padding:0 14px;border-radius:9px;cursor:pointer;color:var(--mute);font-weight:550;font-size:13px;transition:color .2s}
.seg button:hover{color:var(--ink)}
.seg button.on{color:var(--ink)}
.seg .pill{position:absolute;z-index:0;top:3px;bottom:3px;border-radius:9px;background:#fff;box-shadow:0 1px 2px rgba(11,12,15,.08),0 2px 8px -2px rgba(11,12,15,.08);transition:left .35s var(--ease),width .35s var(--ease)}

/* ---------- cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:18px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:8px 8px 18px;display:flex;flex-direction:column;box-shadow:var(--sh);transition:transform .35s var(--ease),box-shadow .35s,border-color .35s;opacity:0;transform:translateY(12px);animation:rise .6s var(--ease) forwards}
.card:hover{transform:translateY(-3px);box-shadow:var(--sh2);border-color:#dfe2e8}
.card>.body{flex:1;padding:16px 14px 0;display:flex;flex-direction:column;gap:14px}
.card .addlogin{margin-top:auto}
@keyframes rise{to{opacity:1;transform:none}}
.plate{position:relative;height:118px;border-radius:15px;background:var(--stagebg);display:grid;place-items:center;overflow:hidden;isolation:isolate}
.plate:before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(11,12,15,.07) 1px,transparent 1px);background-size:14px 14px;-webkit-mask-image:radial-gradient(70% 90% at 50% 50%,#000,transparent);mask-image:radial-gradient(70% 90% at 50% 50%,#000,transparent);z-index:-1;opacity:.8}
.plate:after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(11,12,15,.035);pointer-events:none}
.plate .tl{position:absolute;left:12px;top:12px}
.plate .menu{position:absolute;right:8px;top:8px}
.logo{display:grid;place-items:center;width:60%;height:42px}
.logo img{max-width:100%;max-height:42px;object-fit:contain;display:block;opacity:.9;transition:transform .5s var(--ease),opacity .3s}
.logo.sq img{max-height:52px}
.logo.sq{height:52px}
.card:hover .logo img{transform:scale(1.04);opacity:1}
.logo .ini{width:54px;height:54px;border-radius:15px;background:#fff;box-shadow:0 1px 2px rgba(11,12,15,.06),0 6px 16px -8px rgba(11,12,15,.2);display:grid;place-items:center;font-weight:700;color:var(--ink);font-size:18px;letter-spacing:-.03em}
.logo.ld{width:140px;height:26px;border-radius:8px;background:linear-gradient(110deg,#e9ebf0 30%,#f6f7f9 50%,#e9ebf0 70%);background-size:220% 100%;animation:sk 1.2s infinite}
.ch{display:flex;align-items:flex-start;gap:12px}
.ch .nm{flex:1;min-width:0}
.ch h3{margin:0;font-size:16px;font-weight:650;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.ch .dm{color:var(--soft);font-size:12.5px;display:flex;align-items:center;gap:5px;margin-top:2px}
.ch .dm svg{width:13px;height:13px}
.ch .dm a{color:inherit;text-decoration:none;transition:color .2s}
.ch .dm a:hover{color:var(--brand)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:4px 9px 4px 8px;border-radius:99px;white-space:nowrap;background:#fff;color:var(--ink-2);box-shadow:0 1px 2px rgba(11,12,15,.06),0 0 0 1px rgba(11,12,15,.04)}
.tag i{width:6px;height:6px;border-radius:50%;background:var(--brand)}
.tag.site i{background:var(--ok)}
.tag.warn i{background:var(--warn)}
.tag.no i{background:var(--bad)}
.health{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--mute)}
.health .segs{display:flex;gap:3px}
.health .segs b{width:14px;height:6px;border-radius:3px;background:var(--brand)}
.health .segs b.no{background:var(--bad)}
.health .segs b.err{background:var(--warn)}
.health .segs b.off{background:#e3e6ec}
.health .segs b.unk{background:#cfd6e2}
.health span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.health span em{font-style:normal;color:var(--bad);font-weight:600}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sep{height:1px;background:var(--line-2);margin:0 -2px}
.snip{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--line-2);font-size:12.5px}
.snip b{font-weight:600;color:var(--ink)}
.snip .st{flex:1;color:var(--mute);min-width:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--soft);flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 0 0 rgba(18,162,107,.45);animation:ping 2.2s infinite}
.dot.wait{background:var(--warn)}
.tog{display:inline-flex;align-items:center;gap:9px;border:0;padding:0;cursor:pointer;background:none;font-weight:550;font-size:13px;color:var(--ink-2)}
.tog i{width:34px;height:20px;border-radius:99px;background:#dde1e8;position:relative;transition:background .3s var(--ease)}
.tog i:after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(11,12,15,.25);transition:left .3s var(--ease)}
.tog.on i{background:var(--brand)}
.tog.on i:after{left:16px}
.link{color:var(--brand);cursor:pointer;font-weight:600;font-size:13px;background:none;border:0;padding:0;display:inline-flex;gap:6px;align-items:center}
.link:hover{color:var(--brand-7)}
.link svg{width:15px;height:15px}
.row .link{margin-left:auto}
.users{display:flex;flex-direction:column;gap:6px}
.user{display:flex;align-items:center;gap:11px;border-radius:12px;padding:8px 6px 8px 8px;margin:0 -8px;transition:background .2s}
.user:hover{background:var(--line-2)}
.user .av{width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;font-size:11.5px;font-weight:600;display:grid;place-items:center;flex:none;letter-spacing:.02em}
.user .who{flex:1;min-width:0;line-height:1.3}
.user .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:13.5px}
.user .who small{color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;font-size:12px}
.user.off{opacity:.5}
.user .btn.sm{opacity:.85}
.user:hover .btn.sm{opacity:1}
.empty{color:var(--soft);font-size:13px}
.addlogin{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:38px;border:1px dashed #d5d9e1;border-radius:11px;background:transparent;color:var(--mute);font-weight:600;font-size:13px;cursor:pointer;transition:border-color .2s,color .2s,background .2s}
.addlogin:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-1)}
.menu{position:relative}
.menu .dd{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 48px -16px rgba(11,12,15,.25),0 2px 6px rgba(11,12,15,.04);padding:6px;min-width:228px;z-index:6;opacity:0;transform:translateY(-6px) scale(.98);transform-origin:top right;pointer-events:none;transition:opacity .18s,transform .2s var(--ease)}
.menu.open .dd{opacity:1;transform:none;pointer-events:auto}
/* an open menu sits above the neighbouring cards and outside the logo plate */
.card:has(.menu.open){z-index:30}
.plate:has(.menu.open){overflow:visible;z-index:3}
.plate .menu>.btn{background:rgba(255,255,255,.7);backdrop-filter:blur(6px)}
.dd button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;font-weight:500;font-size:13px;color:var(--ink-2)}
.dd button svg{color:var(--soft)}
.dd button:hover{background:var(--line-2);color:var(--ink)}
.dd button.bad,.dd button.bad svg{color:var(--bad)}
.dd hr{border:0;border-top:1px solid var(--line-2);margin:5px 4px}
.sk{border-radius:22px;height:330px;background:linear-gradient(110deg,#eceef2 30%,#f7f8fa 50%,#eceef2 70%);background-size:220% 100%;animation:sk 1.3s infinite}
@keyframes sk{to{background-position:-120% 0}}

/* ---------- modals ---------- */
.back{position:fixed;inset:0;background:rgba(11,12,15,.38);backdrop-filter:blur(8px);display:grid;place-items:center;z-index:40;padding:20px;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.modal{background:#fff;border-radius:22px;width:min(560px,100%);max-height:90vh;overflow:auto;padding:28px;box-shadow:0 0 0 1px rgba(11,12,15,.04),0 40px 90px -24px rgba(11,12,15,.4);animation:pop .4s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}}
.modal.wide{width:min(820px,100%)}
.modal h2{margin:0 0 6px;font-size:21px;font-weight:700;letter-spacing:-.025em}
.modal p.s{color:var(--mute);margin:0 0 20px;font-size:13.5px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 6px}
.tabs button{position:relative;display:grid;grid-template-columns:36px 1fr;grid-template-rows:auto auto;column-gap:12px;align-items:start;min-height:84px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px 34px 14px 14px;text-align:left;cursor:pointer;transition:border-color .2s,box-shadow .2s,background .2s}
.tabs button:hover{border-color:#d6dae2}
.tabs button .ti{grid-row:1/3;width:36px;height:36px;border-radius:10px;background:var(--line-2);color:var(--mute);display:grid;place-items:center;transition:background .2s,color .2s}
.tabs button .ti svg{width:18px;height:18px}
.tabs button b{display:block;font-size:13.5px;font-weight:600;line-height:1.35}
.tabs button small{color:var(--mute);font-size:12px;line-height:1.4;display:block;margin-top:2px}
.tabs button .rd{position:absolute;right:13px;top:14px;width:16px;height:16px;border-radius:50%;border:1.5px solid #cfd4dd;transition:all .2s}
.tabs button.on{border-color:var(--brand);background:var(--brand-1);box-shadow:0 0 0 3px rgba(0,134,255,.12)}
.tabs button.on .ti{background:var(--brand);color:#fff}
.tabs button.on .rd{border-color:var(--brand);border-width:5px}
.panes{display:grid}
.panes>div{grid-area:1/1;transition:opacity .25s var(--ease),transform .25s var(--ease)}
.panes>div.hid{opacity:0;transform:translateY(4px);pointer-events:none;visibility:hidden}
label.f{display:block;font-weight:600;font-size:13px;margin:16px 0 6px;color:var(--ink)}
label.f small{font-weight:400;color:var(--soft);margin-left:4px}
.in{width:100%;height:42px;border:1px solid var(--line);border-radius:11px;padding:0 13px;background:#fff;box-shadow:0 1px 2px rgba(11,12,15,.04);transition:border-color .2s,box-shadow .2s}
textarea.in{height:auto;padding:10px 13px}
.in:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px rgba(0,134,255,.12)}
.in[readonly]{background:var(--bg);color:var(--mute)}
.mf{display:flex;justify-content:flex-end;gap:8px;margin-top:24px;padding-top:18px;border-top:1px solid var(--line-2)}
.err{background:var(--bad-1);color:var(--bad);border-radius:11px;padding:10px 13px;margin-top:14px;font-size:13px;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.note{background:var(--line-2);color:var(--ink-2);border-radius:11px;padding:11px 13px;margin-top:16px;font-size:12.5px;line-height:1.55}
.note b{color:var(--ink)}
.gets{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:9px}
.gets li{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2)}
.gets li svg{width:16px;height:16px;color:var(--ok);flex:none}
.gets li.off{color:var(--soft)}
.gets li.off svg{color:#c9ced8}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:4px;max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:6px}
.checks label{display:flex;gap:8px;align-items:center;font-size:13px;padding:6px 8px;border-radius:8px;cursor:pointer}
.checks label:hover{background:var(--line-2)}
.checks input{accent-color:var(--brand)}
.code{position:relative;background:var(--ink);color:#d9e8ff;border-radius:14px;padding:16px 92px 16px 16px;font:12.5px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-all}
.code .btn{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.14);color:#fff;box-shadow:none}
.code .btn:hover{background:rgba(255,255,255,.18)}
.steps{margin:16px 0 0;padding:0;list-style:none;display:grid;gap:9px}
.steps li{display:flex;gap:11px;font-size:13px;color:var(--ink-2)}
.steps li>b{width:22px;height:22px;border-radius:50%;background:var(--line-2);color:var(--ink);display:grid;place-items:center;font-size:11px;flex:none;font-weight:600}
.chat{border-bottom:1px solid var(--line-2);padding:14px 0}
.chat .q{font-weight:600}
.chat .a{color:var(--ink-2);white-space:pre-wrap;margin-top:4px}
.chat small{color:var(--soft)}
.share{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;font:13px/1.6 ui-monospace,Menlo,monospace}

/* ---------- loading stage (every action) ---------- */
.stage{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(248,249,251,.7);backdrop-filter:blur(12px) saturate(1.4);animation:fade .25s}
.stage.out{animation:fadeout .4s forwards}
@keyframes fadeout{to{opacity:0}}

.stage .box:before{content:"";position:absolute;inset:0 0 auto 0;height:140px;background:radial-gradient(60% 100% at 50% 0%,rgba(0,134,255,.10),transparent);pointer-events:none}
.orb{position:relative;width:92px;height:92px;margin:0 auto 18px}
.orb img{position:absolute;inset:26px;width:40px;height:40px;animation:breathe 1.8s ease-in-out infinite}
.orb svg{position:absolute;inset:0;width:92px;height:92px;animation:spin 1.4s linear infinite}
.orb .halo{position:absolute;inset:8px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,134,255,.16),transparent);animation:breathe 1.8s ease-in-out infinite}

@keyframes breathe{50%{transform:scale(1.07)}}
.orb.done svg{animation:none;opacity:0;transition:opacity .2s}
.orb .tick{position:absolute;inset:14px;border-radius:50%;background:var(--ok);box-shadow:0 10px 24px -8px rgba(18,162,107,.6);display:grid;place-items:center;transform:scale(0);transition:transform .45s cubic-bezier(.2,1.6,.4,1)}
.orb.done .tick{transform:scale(1)}
.orb.done img,.orb.done .halo{opacity:0;transition:opacity .2s}
.orb .tick svg{position:static;width:32px;height:32px;animation:none;stroke:#fff;stroke-width:3;fill:none;stroke-dasharray:40;stroke-dashoffset:40;transition:stroke-dashoffset .5s .15s}
.orb.done .tick svg{stroke-dashoffset:0}
.orb.fail .tick{background:var(--bad);box-shadow:0 10px 24px -8px rgba(229,72,77,.6)}
.stage h3{margin:0;font-size:18px;font-weight:700;letter-spacing:-.02em;position:relative}
.stage .sub{color:var(--mute);margin:5px 0 0;font-size:13px;min-height:20px;position:relative}
.stage .pb{height:4px;border-radius:99px;background:var(--line-2);overflow:hidden;margin:22px 0 16px}
.stage .pb i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--brand),#6cb8ff,var(--brand));background-size:200% 100%;animation:flow 1.4s linear infinite;transition:width .6s var(--ease)}
@keyframes flow{to{background-position:-200% 0}}
.stage ul{list-style:none;margin:0;padding:0;text-align:left;display:grid;gap:10px}
.stage li{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--soft);transition:color .3s}
.stage li .s{width:18px;height:18px;border-radius:50%;border:1.5px solid #dfe3ea;flex:none;display:grid;place-items:center;transition:all .3s}
.stage li.on{color:var(--ink);font-weight:550}
.stage li.on .s{border-color:var(--brand);border-right-color:transparent;animation:spin .8s linear infinite}
.stage li.ok{color:var(--mute)}
.stage li.ok .s{border-color:var(--ink);background:var(--ink)}
.stage li.ok .s:after{content:"";width:7px;height:3.5px;border:1.6px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.burst{position:fixed;pointer-events:none;z-index:70}
.burst i{position:absolute;width:7px;height:7px;border-radius:2px;animation:burst .9s var(--ease) forwards}

/* ---------- toasts ---------- */
.toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:grid;gap:8px;z-index:80}

.toast.bad:after{background:var(--bad)}
.toast .ti{width:22px;height:22px;border-radius:50%;background:var(--ok);display:grid;place-items:center;flex:none}
.toast.bad .ti{background:var(--bad)}
.toast .ti svg{width:13px;height:13px;stroke:#fff;stroke-width:2.6}

.splash{min-height:100vh;display:grid;place-items:center;padding:20px}
.signbox{position:relative;background:#fff;border:1px solid var(--line);border-radius:24px;padding:36px 34px 30px;width:min(420px,100%);box-shadow:0 40px 90px -36px rgba(0,60,140,.35);animation:pop .6s var(--ease)}

.garow.sc svg{color:#1a73e8}
.garow.ai svg{color:#7c3aed}

.ai-src>div{flex:1;min-width:0;line-height:1.35}
.ai-src b{display:block;font-size:13.5px}

.garow.add svg:last-child{color:var(--soft)}
.steps li b.sel{display:inline;width:auto;height:auto;border-radius:6px;background:var(--brand-1);color:var(--brand-7);padding:1px 6px;font-size:12.5px;user-select:all}

details.where summary:before{content:"";width:6px;height:6px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(-45deg);transition:transform .2s}

/* ---------- sign in ---------- */
/* ---------- team sign-in + 5-minute idle sign-out ----------
   Teammates sign in with their email and password and get a session that the backend ends after
   5 minutes without activity. This page also watches for activity (mouse, keys, scrolling, taps):
   after 5 quiet minutes it signs out, in every open tab, and says why on the sign-in screen. */
const IDLE_MS = 5 * 60 * 1000, LASTK = 'el_console_last', MEK = 'el_console_me';
let ME = null, BOOT_NOTE = '', lastW = 0;
try { ME = JSON.parse(localStorage.getItem(MEK) || 'null'); } catch (e) {}
const isTeamTok = () => String(KEY).indexOf('ts_') === 0;
const lastActive = () => { try { return +localStorage.getItem(LASTK) || 0; } catch (e) { return 0; } };
function markActive(force) { const n = Date.now(); if (!force && n - lastW < 4000) return; lastW = n; try { localStorage.setItem(LASTK, String(n)); } catch (e) {} }
const IDLE_NOTE = 'You were signed out after 5 minutes without activity. Sign in again to continue.';
if (KEY) {
  const la = lastActive();
  if (la && Date.now() - la > IDLE_MS) { KEY = ''; ME = null; BOOT_NOTE = IDLE_NOTE; try { sessionStorage.removeItem(KEYS); localStorage.removeItem(KEYS); localStorage.removeItem(MEK); } catch (e) {} }
  else markActive(true);
}
['pointerdown', 'mousemove', 'keydown', 'wheel', 'touchstart', 'scroll'].forEach(ev => window.addEventListener(ev, () => { if (KEY) markActive(); }, { passive: true, capture: true }));
function idleCheck() { if (KEY && Date.now() - lastActive() > IDLE_MS) { $$('.stage').forEach(x => x.remove()); signOut('idle'); } }
setInterval(idleCheck, 10000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) idleCheck(); });
/* Another tab signed out (or in): follow it. */
window.addEventListener('storage', e => {
  if (e.key !== KEYS) return;
  if (!e.newValue && KEY) { KEY = ''; signOut(Date.now() - lastActive() > IDLE_MS ? 'idle' : ''); }
});
/* While someone is active, keep their backend session alive (it ends after 5 quiet minutes). */
setInterval(() => { if (isTeamTok() && Date.now() - lastActive() < 125000) call('teamPing').catch(err => { if (err.auth) signOut('ended'); }); }, 120000);

function signOut(reason) {
  const tok = String(KEY || ''); KEY = ''; ME = null;
  try { sessionStorage.removeItem(KEYS); localStorage.removeItem(KEYS); localStorage.removeItem(MEK); } catch (e) {}
  if (tok.indexOf('ts_') === 0) fetch(API, { method: 'POST', body: JSON.stringify({ action: 'teamLogout', key: tok }) }).catch(() => {});
  $$('.back').forEach(b => b.remove());
  signIn(reason === 'idle' ? IDLE_NOTE : reason === 'ended' ? 'Your session ended. Sign in again to continue.' : '');
}

  if (c.site || c.connected) parts.push('leads');
  if (aiTracked(c)) parts.push('AI Overview checks');
  return { on: !!(gaOf(c) || aiTracked(c)), txt: parts.length ? parts.join(' · ') : 'connect GA or the Tracker' };
}
function aiForm(c) {
  const T = S.ai || {}, ga = !!gaOf(c), tr = aiTracked(c);
  const row = (ok, title, sub, btn) => '<div class="ai-src' + (ok ? ' ok' : '') + '"><i>' + (ok ? '✓' : '') + '</i><div><b>' + title + '</b><small>' + sub + '</small></div>' + (btn || '') + '</div>';
  const m = modal('<h2>AI visibility · ' + esc(c.name) + '</h2><p class="s">Shows how ChatGPT, Perplexity, Gemini, Copilot and Claude send people to the business, and whether Google’s AI Overviews mention it, in an <b>AI visibility</b> tab on their dashboard.</p>' +
    row(ga, 'Visits from AI assistants', ga ? 'From Google Analytics (property ' + esc(gaOf(c)) + ').' : 'Needs Google Analytics on this client.', ga ? '' : '<button type="button" class="btn sm" data-ga>Connect GA</button>') +
    row(!!(c.site || c.connected), 'Leads from AI assistants', c.connected ? 'From Easyleads: form leads that arrived from an AI assistant are recognised from the page\u2019s tracking tags and referrer.' : c.site ? 'From the website snippet: leads arriving from an AI assistant are recognised automatically.' : 'Needs the website snippet or an Easyleads account on this client.') +
    row(tr, 'Google AI Overview checks', tr ? 'From the AI Visibility Tracker: each tracked search, checked for an AI Overview that cites or names the business.'
      : T.connected ? esc(c.domain) + ' isn’t followed by the Tracker yet. Add it as an SEO client with keywords in the EDGE SEO tool; the Tracker picks it up from there.'
      : 'The AI Visibility Tracker isn’t connected to Easyleads yet. Connect it once below and it works for every client it follows.') +
    (T.connected ? '<div class="note">Tracker connected · follows ' + (T.domains || []).length + ' websites' + (T.error ? ' · <span style="color:var(--bad)">' + esc(T.error) + '</span>' : '') + '. <button type="button" class="link" data-trk>Change</button></div>' : '') +
    '<form data-tf' + (T.connected ? ' hidden' : '') + '><label class="f">AI Visibility Tracker web app URL</label><input class="in" name="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">' +
    '<label class="f">Tracker key</label><input class="in" name="key" type="password" autocomplete="off" placeholder="The key from the SEO tool’s AI Visibility settings (⚙)"><div class="err" hidden></div>' +
    '<p class="s" style="margin-top:8px">Both are in the EDGE SEO tool → AI Visibility tab → ⚙. The key stays on the Easyleads server and is never shown again.</p>' +
    '<div class="mf">' + (T.connected ? '<button type="button" class="btn bad" data-tdis style="margin-right:auto">Disconnect the Tracker</button>' : '') + '<button class="btn pri">Connect the Tracker</button></div></form>' +
    '<div class="mf" data-done><button type="button" class="btn pri" data-close>Done</button></div>', true);
  const gb = $('[data-ga]', m.el); if (gb) gb.onclick = () => { m.close(); gaForm(c); };
  const tf = $('[data-tf]', m.el), ch = $('[data-trk]', m.el);
  if (ch) ch.onclick = () => { tf.hidden = false; tf.url.focus(); };
  const send = async (url, key) => {
    const er = $('.err', tf); er.hidden = true;
    try {
      const j = await call('elSetTracker', { url, tkey: key });   /* not "key": that field carries the team key */
      if (j && j.error) throw new Error(j.error);
      S.ai = Object.assign({}, S.ai || {}, { connected: !!j.connected, domains: j.domains || [], error: '' });
      m.close(); draw(); toast(j.connected ? 'AI Visibility Tracker connected · follows ' + (j.domains || []).length + ' websites' : 'Tracker disconnected'); aiLoad();
    } catch (err) { er.hidden = false; er.textContent = err.message; }
  };
  tf.onsubmit = e => { e.preventDefault(); const u = tf.url.value.trim(), k = tf.key.value.trim(); if (!u || !k) { const er = $('.err', tf); er.hidden = false; er.textContent = 'Paste both the URL and the key.'; return; } send(u, k); };
  const td = $('[data-tdis]', m.el); if (td) td.onclick = () => { if (confirm('Disconnect the AI Visibility Tracker from Easyleads? AI Overview checks disappear from every dashboard.')) send('', ''); };
}

async function clientAct(a, c) {
  if (!c) return;
  $$('.menu.open').forEach(x => x.classList.remove('open'));
  try {
    if (a === 'login') return userForm(null, c.domain);
    if (a === 'reconnect') return clientForm(c);
    if (a === 'snippet') return showSnippet(c);
    if (a === 'ga') return gaForm(c);
    if (a === 'gsc') return gscForm(c);
    if (a === 'ai') return aiForm(c);
    if (a === 'import') return importForm(c);
    if (a === 'bot') {
      await stage(c.bot ? 'Turning the assistant off' : 'Turning the assistant on', c.bot ? ['Updating ' + c.name, 'Saving'] : ['Updating ' + c.name, 'Preparing their dashboard data', 'Saving'], async () => { await call('portalAdminBot', { domain: c.domain, on: !c.bot }); await refresh(); }, 'Assistant ' + (c.bot ? 'off' : 'on'));
      return toast('Assistant ' + (c.bot ? 'off' : 'on') + ' for ' + c.name);
    }
    if (a === 'recheck') { await stage('Re-checking ' + c.name, ['Reaching their Easyleads account', 'Testing each permission', 'Saving the results'], async () => { await call('portalAdminCheck', { domain: c.domain }); await refresh(); }, c.name + ' re-checked'); return toast(c.name + ' re-checked'); }
    if (a === 'logo') { await stage('Finding ' + c.name + '’s logo', ['Visiting ' + c.domain, 'Looking for their icon and logo', 'Checking the images load', 'Saving'], async () => { await call('elLogo', { domain: c.domain }); await refresh(); }, 'Logo updated'); return toast('Logo updated'); }
    if (a === 'logourl') {
      const m = modal('<h2>Use my own logo</h2><p class="s">Paste the address of an image (PNG, JPG, SVG or WebP) for ' + esc(c.name) + '.</p><form><label class="f">Image address</label><input class="in" name="u" placeholder="https://…/logo.png" required><div class="err" hidden></div><div class="mf"><button type="button" class="btn" data-close>Cancel</button><button class="btn pri">Use this logo</button></div></form>');
      $('form', m.el).onsubmit = async e => { e.preventDefault(); const u = e.target.u.value.trim(); m.close(); try { await stage('Setting the logo', ['Checking the image', 'Saving'], async () => { await call('elLogo', { domain: c.domain, url: u }); await refresh(); }, 'Logo updated'); toast('Logo updated'); } catch (err) {} };
      return;
    }
    if (a === 'rename') {
      const m = modal('<h2>Rename client</h2><form><label class="f">Name</label><input class="in" name="n" value="' + esc(c.name) + '" required><div class="mf"><button type="button" class="btn" data-close>Cancel</button><button class="btn pri">Save</button></div></form>');
      $('form', m.el).onsubmit = async e => { e.preventDefault(); const n = e.target.n.value; m.close(); try { await stage('Renaming', ['Saving the new name'], async () => { await call('elRenameClient', { domain: c.domain, name: n }); await refresh(); }, 'Renamed'); toast('Renamed'); } catch (err) {} };
      return;
    }
    if (a === 'remove') {
      if (!await confirmBox('Remove ' + c.name + '?', 'Their connection is deleted from the console. Logins stay, but their dashboard shows nothing until the client is added again.', 'Remove client')) return;
      await stage('Removing ' + c.name, ['Deleting the connection', 'Updating the client list'], async () => { await call('elRemoveClient', { domain: c.domain }); await refresh(); }, c.name + ' removed');
      return toast(c.name + ' removed');
    }
    if (a === 'chats') {
      const m = modal('<h2>Assistant chats · ' + esc(c.name) + '</h2><p class="s">Newest first.</p><div data-c><div class="boot" style="padding:30px 0">' + orb() + '<span>Loading the conversations…</span></div></div><div class="mf"><button class="btn" data-close>Close</button></div>', true);
      const j = await call('portalAdminChats', { domain: c.domain });
      const rows = (j.rows || []).slice().reverse();
      $('[data-c]', m.el).innerHTML = rows.length ? rows.map(r => '<div class="chat"><small>' + esc(new Date(r.t).toLocaleString('en-CA')) + ' · ' + esc(r.name || r.email) + (r.as === 'Team' || r.as === 'EDGE' ? ' · viewed by the team' : '') + '</small><div class="q">' + esc(r.q) + '</div><div class="a">' + esc(r.a) + '</div></div>').join('') : '<div class="empty">No chats yet.</div>';
    }
  } catch (err) { if (a === 'chats') toast(err.message, 1); }
}
async function userAct(a, u) {
  if (!u) return;
  $$('.menu.open').forEach(x => x.classList.remove('open'));
  try {
    if (a === 'edit') return userForm(u);
    if (a === 'as') {
      const w = window.open('about:blank', '_blank');
      const j = await stage('Opening ' + (u.name || u.email) + '’s dashboard', ['Creating a secure team session', 'Opening their dashboard'], () => call('portalAdminSession', { id: u.id }), 'Opening now');
      const url = PORTAL + '#s=' + encodeURIComponent(j.session);
      if (w) w.location = url; else location.href = url;
      return;
    }
    const base = { id: u.id, name: u.name, email: u.email, domains: u.domains, disabled: !!u.disabled };
    if (a === 'toggle') { await stage(u.disabled ? 'Turning the login back on' : 'Turning the login off', u.disabled ? ['Updating the account', 'Saving'] : ['Updating the account', 'Signing them out everywhere', 'Saving'], async () => { await call('portalAdminSave', Object.assign(base, { disabled: !u.disabled, signOut: !u.disabled })); await refresh(); }, u.disabled ? 'Login on' : 'Login off'); return toast(u.disabled ? 'Login turned back on' : 'Login turned off'); }
    if (a === 'signout') { await stage('Signing out everywhere', ['Ending every session', 'Saving'], () => call('portalAdminSave', Object.assign(base, { signOut: true })), 'Signed out everywhere'); return toast('Signed out on every device'); }
    if (a === 'del') {
      if (!await confirmBox('Delete ' + (u.name || u.email) + '?', 'They can’t sign in again and their own dashboard layout is deleted. This can’t be undone.', 'Delete login')) return;
      await stage('Deleting the login', ['Removing the account', 'Removing their dashboard layout', 'Saving'], async () => { await call('portalAdminDelete', { id: u.id }); await refresh(); }, 'Login deleted');
      return toast('Login deleted');
    }
  } catch (err) {}
}

/* ---------- start ---------- */
if (!API) { app.innerHTML = '<div class="splash"><div class="signbox">This console isn’t set up yet.</div></div>'; return; }
if (!KEY) { signIn(); return; }
app.innerHTML = '<div class="splash"><div class="boot">' + orb() + '<span>Loading your clients…</span></div></div>';
fetchAll().then(d => { shell(); apply(d); }).catch(err => { if (err.auth) signOut(); else signIn(err.message); });
})();
</script>
</body>
