<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Easyleads · Client console</title>
<link rel="icon" href="../img/easyleads-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--b1:#0b5fd0;--b2:#1d7cf2;--b3:#5aa2ff;--navy:#0a2a5c;--ink:#0d1a2d;--mute:#5d6b82;--soft:#8a97ab;--line:#e2e9f3;--bg:#f4f7fc;--card:#fff;--ok:#0f9d6b;--bad:#d93848;--warn:#b7791f;--r:18px;--sh:0 1px 2px rgba(13,26,45,.04),0 8px 24px -12px rgba(13,26,45,.12);--sh2:0 2px 4px rgba(11,95,208,.06),0 24px 48px -18px rgba(11,95,208,.30);--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:14px/1.5 Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;min-height:100vh}
body:before{content:"";position:fixed;inset:-20% -10% auto auto;width:780px;height:780px;background:radial-gradient(closest-side,rgba(29,124,242,.13),transparent);pointer-events:none;z-index:0;animation:drift 22s ease-in-out infinite alternate}
body:after{content:"";position:fixed;inset:auto auto -25% -15%;width:720px;height:720px;background:radial-gradient(closest-side,rgba(90,162,255,.10),transparent);pointer-events:none;z-index:0;animation:drift 26s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(-60px,40px) scale(1.08)}}
#app{position:relative;z-index:1}
button,input,select,textarea{font:inherit;color:inherit}
::selection{background:#cfe2ff}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:14px;padding:12px 30px;background:rgba(255,255,255,.78);backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid rgba(226,233,243,.9)}
.top .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.top .brand img{width:30px;height:30px;transition:transform .5s var(--ease)}
.top .brand:hover img{transform:rotate(-8deg) scale(1.06)}
.top .brand b{font-size:19px;font-weight:800;letter-spacing:-.03em}
.top .sub{color:var(--mute);border-left:1px solid var(--line);padding-left:14px;line-height:1.15;font-weight:600;font-size:13px}
.top .sub small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);font-weight:700}
.top .sp{flex:1}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--mute);padding:6px 11px;border-radius:99px;background:#fff;border:1px solid var(--line)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(15,157,107,.5);animation:ping 2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 7px rgba(15,157,107,0)}100%{box-shadow:0 0 0 0 rgba(15,157,107,0)}}

/* ---------- buttons ---------- */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 16px;cursor:pointer;font-weight:600;transition:transform .18s var(--ease),box-shadow .2s,border-color .2s,background .2s;overflow:hidden;white-space:nowrap}
.btn:hover{border-color:#c7d6ec;box-shadow:0 6px 18px -8px rgba(11,95,208,.25);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.pri{background:linear-gradient(120deg,var(--b1),var(--b2) 60%,var(--b3));background-size:180% 100%;border-color:transparent;color:#fff;box-shadow:0 8px 20px -10px rgba(11,95,208,.7)}
.btn.pri:hover{background-position:100% 0;box-shadow:0 14px 28px -12px rgba(11,95,208,.8)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:#eef3fb}
.btn.bad{color:var(--bad)}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn .rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:rip .6s var(--ease);pointer-events:none}
.btn:not(.pri) .rip{background:rgba(11,95,208,.15)}
@keyframes rip{to{transform:scale(4);opacity:0}}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- page ---------- */
main{max-width:1280px;margin:0 auto;padding:34px 30px 80px}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:22px}
.hero h1{font-size:34px;font-weight:800;letter-spacing:-.04em;margin:0;line-height:1.1}
.hero h1 span{background:linear-gradient(120deg,var(--b1),var(--b2),var(--b3));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mute);margin:8px 0 0;max-width:620px}
.acts{display:flex;flex-wrap:wrap;gap:10px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin:0 0 22px}
.stat{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px 15px;box-shadow:var(--sh);overflow:hidden;transition:transform .25s var(--ease),box-shadow .25s}
.stat:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.stat:after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:radial-gradient(closest-side,rgba(29,124,242,.12),transparent)}
.stat .v{font-size:30px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.stat .l{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--soft);font-weight:700}
.stat.warn .v{color:var(--warn)}
.bar{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:260px;position:relative}
.search input{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 14px 12px 40px;background:#fff;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.search input:focus{outline:none;border-color:var(--b2);box-shadow:0 0 0 4px rgba(29,124,242,.14)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--soft)}
.seg{display:flex;background:#e8eef7;border-radius:14px;padding:4px;position:relative}
.seg button{position:relative;z-index:1;border:0;background:transparent;padding:8px 14px;border-radius:10px;cursor:pointer;color:var(--mute);font-weight:600;transition:color .2s}
.seg button.on{color:var(--ink)}
.seg .pill{position:absolute;z-index:0;top:4px;bottom:4px;border-radius:10px;background:#fff;box-shadow:0 2px 8px rgba(13,26,45,.10);transition:left .35s var(--ease),width .35s var(--ease)}

/* ---------- cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(370px,1fr));gap:18px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--sh);transition:transform .3s var(--ease),box-shadow .3s,border-color .3s;opacity:0;transform:translateY(14px);animation:rise .55s var(--ease) forwards}
.card:hover{transform:translateY(-3px);box-shadow:var(--sh2);border-color:#d4e2f5}
.card:before{content:"";position:absolute;inset:0 0 auto 0;height:3px;border-radius:22px 22px 0 0;background:linear-gradient(90deg,var(--b1),var(--b2),var(--b3));opacity:.85}
.card.site:before{background:linear-gradient(90deg,#0f9d6b,#34c38f)}
@keyframes rise{to{opacity:1;transform:none}}
.ch{display:flex;align-items:center;gap:13px}
.logo{width:52px;height:52px;border-radius:15px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;flex:none;overflow:hidden;box-shadow:0 4px 12px -6px rgba(13,26,45,.18);position:relative}
.logo img{width:78%;height:78%;object-fit:contain;display:block;opacity:0;transition:opacity .4s,transform .4s var(--ease)}
.logo.wide{width:auto;min-width:52px;max-width:132px;padding:0 10px}
.logo.wide img{width:auto;height:30px;max-width:112px}
.card:hover .logo img{transform:scale(1.06)}
.logo img.in{opacity:1}
.logo .ini{font-weight:800;color:var(--b1);font-size:16px;letter-spacing:-.02em}
.logo.ld:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.8) 50%,transparent 70%),#eef3fa;background-size:220% 100%;animation:sk 1.2s infinite}
.ch .nm{flex:1;min-width:0}
.ch h3{margin:0;font-size:16.5px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch .dm{color:var(--soft);font-size:12.5px;display:flex;align-items:center;gap:6px}
.ch .dm a{color:inherit;text-decoration:none}
.ch .dm a:hover{color:var(--b1)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap;letter-spacing:.01em}
.tag i{width:6px;height:6px;border-radius:50%;background:currentColor}
.tag.el{background:#e8f1ff;color:var(--b1)}
.tag.site{background:#e4f7ef;color:var(--ok)}
.tag.warn{background:#fdf2df;color:var(--warn)}
.tag.no{background:#fdecee;color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:4px 9px;border-radius:9px;background:#f1f6fe;color:#2b5aa8;font-weight:600}
.chip svg{width:12px;height:12px}
.chip.no{background:#fdecee;color:var(--bad)}
.chip.off{background:#f3f5f8;color:var(--soft)}
.chip.err{background:#fdf2df;color:var(--warn)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.snip{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:linear-gradient(135deg,#f3fbf7,#f7fbff);border:1px solid #dcefe6;font-size:13px}
.snip b{font-weight:700}
.snip .st{flex:1;color:var(--mute)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--soft);flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 0 0 rgba(15,157,107,.5);animation:ping 2s infinite}
.dot.wait{background:var(--warn)}
.tog{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:99px;padding:5px 13px 5px 6px;cursor:pointer;background:#fff;font-weight:600;font-size:13px;transition:border-color .2s,box-shadow .2s}
.tog:hover{border-color:#c7d6ec;box-shadow:0 4px 12px -6px rgba(11,95,208,.3)}
.tog i{width:36px;height:21px;border-radius:99px;background:#cfd8e6;position:relative;transition:background .3s var(--ease)}
.tog i:after{content:"";position:absolute;top:3px;left:3px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .3s var(--ease)}
.tog.on i{background:linear-gradient(120deg,var(--b1),var(--b2))}
.tog.on i:after{left:18px}
.link{color:var(--b1);cursor:pointer;font-weight:600;background:none;border:0;padding:0;display:inline-flex;gap:6px;align-items:center}
.link:hover{text-decoration:underline}
.users{display:flex;flex-direction:column;gap:8px}
.user{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:14px;padding:9px 10px 9px 11px;background:#fafcff;transition:background .2s,border-color .2s}
.user:hover{background:#f4f8ff;border-color:#d6e3f5}
.user .av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--b1),var(--b3));color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;flex:none}
.user .who{flex:1;min-width:0;line-height:1.25}
.user .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.user .who small{color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;font-size:12px}
.user.off{opacity:.55}
.empty{color:var(--soft);font-size:13px;padding:2px 0}
.menu{position:relative}
.menu .dd{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 40px -12px rgba(13,26,45,.25);padding:6px;min-width:220px;z-index:6;opacity:0;transform:translateY(-6px) scale(.98);pointer-events:none;transition:opacity .18s,transform .18s var(--ease)}
.menu.open .dd{opacity:1;transform:none;pointer-events:auto}
.dd button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:9px;cursor:pointer;font-weight:500}
.dd button:hover{background:#f1f5fb}
.dd button.bad{color:var(--bad)}
.dd hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
.foot{margin-top:2px}
.sk{border-radius:22px;height:260px;background:linear-gradient(110deg,#eaf0f8 30%,#f6f9fd 50%,#eaf0f8 70%);background-size:220% 100%;animation:sk 1.3s infinite}
@keyframes sk{to{background-position:-120% 0}}

/* ---------- modals ---------- */
.back{position:fixed;inset:0;background:rgba(8,22,46,.42);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:40;padding:20px;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.modal{background:#fff;border-radius:24px;width:min(560px,100%);max-height:90vh;overflow:auto;padding:28px;box-shadow:0 40px 90px -20px rgba(8,22,46,.45);animation:pop .4s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.97)}}
.modal.wide{width:min(880px,100%)}
.modal h2{margin:0 0 6px;font-size:22px;font-weight:800;letter-spacing:-.03em}
.modal p.s{color:var(--mute);margin:0 0 18px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 18px}
.tabs button{border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:14px;text-align:left;cursor:pointer;transition:border-color .2s,box-shadow .2s,background .2s}
.tabs button b{display:block;font-size:14px}
.tabs button small{color:var(--mute)}
.tabs button.on{border-color:var(--b2);background:#f5f9ff;box-shadow:0 0 0 4px rgba(29,124,242,.12)}
label.f{display:block;font-weight:600;font-size:13px;margin:14px 0 6px}
label.f small{font-weight:400;color:var(--soft)}
.in{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:#fff;transition:border-color .2s,box-shadow .2s}
.in:focus{outline:none;border-color:var(--b2);box-shadow:0 0 0 4px rgba(29,124,242,.14)}
.mf{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
.err{background:#fdecee;color:var(--bad);border-radius:12px;padding:10px 13px;margin-top:14px;font-size:13px;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.note{background:#f1f6ff;color:#284a80;border-radius:12px;padding:11px 13px;margin-top:14px;font-size:13px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:190px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:8px}
.checks label{display:flex;gap:8px;align-items:center;font-size:13px;padding:5px 6px;border-radius:8px;cursor:pointer}
.checks label:hover{background:#f4f8ff}
.code{position:relative;background:#0d1a2d;color:#cfe2ff;border-radius:14px;padding:16px 16px 16px 16px;font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-all}
.code .btn{position:absolute;top:10px;right:10px}
.steps{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.steps li{display:flex;gap:10px;font-size:13px;color:#2c3a50}
.steps li b{width:22px;height:22px;border-radius:50%;background:#e8f1ff;color:var(--b1);display:grid;place-items:center;font-size:11px;flex:none}
.chat{border-bottom:1px solid var(--line);padding:13px 0}
.chat .q{font-weight:600}
.chat .a{color:#2c3a50;white-space:pre-wrap;margin-top:4px}
.chat small{color:var(--soft)}
.share{white-space:pre-wrap;background:#f6f9fd;border:1px solid var(--line);border-radius:12px;padding:14px;font:13px/1.6 ui-monospace,Menlo,monospace}

/* ---------- loading stage (every action) ---------- */
.stage{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(244,247,252,.72);backdrop-filter:blur(10px) saturate(1.4);animation:fade .25s}
.stage.out{animation:fadeout .4s forwards}
@keyframes fadeout{to{opacity:0}}
.stage .box{width:min(420px,92vw);background:#fff;border-radius:26px;padding:30px 30px 26px;box-shadow:0 40px 90px -24px rgba(11,95,208,.45);text-align:center;animation:pop .45s var(--ease)}
.orb{position:relative;width:96px;height:96px;margin:0 auto 18px}
.orb img{position:absolute;inset:26px;width:44px;height:44px;animation:breathe 1.8s ease-in-out infinite}
.orb svg{position:absolute;inset:0;width:96px;height:96px;animation:spin 1.6s linear infinite}
.orb .halo{position:absolute;inset:10px;border-radius:50%;background:radial-gradient(closest-side,rgba(29,124,242,.18),transparent);animation:breathe 1.8s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{transform:scale(1.08)}}
.orb.done svg{animation:none;opacity:0;transition:opacity .2s}
.orb .tick{position:absolute;inset:14px;border-radius:50%;background:linear-gradient(135deg,var(--ok),#34c38f);display:grid;place-items:center;transform:scale(0);transition:transform .45s cubic-bezier(.2,1.6,.4,1)}
.orb.done .tick{transform:scale(1)}
.orb.done img,.orb.done .halo{opacity:0;transition:opacity .2s}
.orb .tick svg{position:static;width:34px;height:34px;animation:none;stroke:#fff;stroke-width:3;fill:none;stroke-dasharray:40;stroke-dashoffset:40;transition:stroke-dashoffset .5s .15s}
.orb.done .tick svg{stroke-dashoffset:0}
.orb.fail .tick{background:linear-gradient(135deg,var(--bad),#ef6b77)}
.stage h3{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em}
.stage .sub{color:var(--mute);margin:5px 0 0;font-size:13.5px;min-height:20px}
.stage .pb{height:6px;border-radius:99px;background:#edf2f9;overflow:hidden;margin:20px 0 14px}
.stage .pb i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--b1),var(--b2),var(--b3),var(--b1));background-size:300% 100%;animation:flow 1.6s linear infinite;transition:width .6s var(--ease)}
@keyframes flow{to{background-position:-300% 0}}
.stage ul{list-style:none;margin:0;padding:0;text-align:left;display:grid;gap:9px}
.stage li{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--soft);transition:color .3s}
.stage li .s{width:20px;height:20px;border-radius:50%;border:2px solid #dbe4f1;flex:none;display:grid;place-items:center;transition:all .3s}
.stage li.on{color:var(--ink);font-weight:600}
.stage li.on .s{border-color:var(--b2);border-right-color:transparent;animation:spin .8s linear infinite}
.stage li.ok{color:var(--mute)}
.stage li.ok .s{border-color:var(--ok);background:var(--ok)}
.stage li.ok .s:after{content:"";width:8px;height:4px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.burst{position:fixed;pointer-events:none;z-index:70}
.burst i{position:absolute;width:8px;height:8px;border-radius:2px;animation:burst .9s var(--ease) forwards}
@keyframes burst{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}

/* ---------- toasts ---------- */
.toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:grid;gap:8px;z-index:80}
.toast{display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;padding:11px 16px 11px 12px;border-radius:14px;font-weight:600;box-shadow:0 18px 40px -12px rgba(0,0,0,.4);animation:tin .4s var(--ease);position:relative;overflow:hidden}
.toast:after{content:"";position:absolute;left:0;bottom:0;height:3px;background:var(--b3);animation:tbar 3.4s linear forwards}
.toast.bad:after{background:#ff8a95}
.toast .ti{width:24px;height:24px;border-radius:50%;background:var(--ok);display:grid;place-items:center;flex:none}
.toast.bad .ti{background:var(--bad)}
.toast .ti svg{width:14px;height:14px;stroke:#fff}
@keyframes tin{from{opacity:0;transform:translateY(12px) scale(.96)}}
@keyframes tbar{from{width:100%}to{width:0}}

/* ---------- sign in / splash ---------- */
.splash{min-height:100vh;display:grid;place-items:center;padding:20px}
.signbox{position:relative;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:28px;padding:38px 36px 32px;width:min(430px,100%);box-shadow:0 40px 90px -30px rgba(11,95,208,.35);animation:pop .6s var(--ease)}
.signbox .brand{display:flex;align-items:center;gap:11px;margin-bottom:22px}
.signbox .brand img{width:38px;height:38px}
.signbox .brand b{font-size:24px;font-weight:800;letter-spacing:-.03em}

</head>
<body>
<div id="app"></div>
<div class="toasts" id="toasts"></div>
<script src="../portal-config.js"></script>
<script>
(function () {
'use strict';
const API = (window.PORTAL_CONFIG || {}).api;
const KEYS = 'el_console_key';
const BASE = new URL('../', location.href).href;
const PORTAL = BASE;
const SNIPPET_SRC = BASE + 't.js';
const MARK = '../img/easyleads-mark.png';
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => [...(r || document).querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const app = $('#app');
let KEY = '';
try { KEY = sessionStorage.getItem(KEYS) || localStorage.getItem(KEYS) || ''; } catch (e) {}
const S = { users: [], clients: [], info: {}, scopes: null, filter: 'all', q: '', site: {} };
const AREAS = [['forms', 'Forms'], ['calls', 'Calls'], ['contacts', 'Contacts'], ['opps', 'Pipeline'], ['appts', 'Bookings'], ['emails', 'Email']];
const I = {
  check: '<svg class="i" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>',
  x: '<svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  plus: '<svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  user: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
  link: '<svg class="i" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>',
  refresh: '<svg class="i" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>',
  search: '<svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  dots: '<svg class="i" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>',
  eye: '<svg class="i" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  chat: '<svg class="i" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.5 7.2L4 21l1.8-5.5A8 8 0 1 1 21 12z"/></svg>',
  code: '<svg class="i" viewBox="0 0 24 24"><path d="m8 7-5 5 5 5M16 7l5 5-5 5"/></svg>',
  img: '<svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>',
  edit: '<svg class="i" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>',
  trash: '<svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  key: '<svg class="i" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M17 6l3 3"/></svg>',
  power: '<svg class="i" viewBox="0 0 24 24"><path d="M12 3v9M6.3 7.3a8 8 0 1 0 11.4 0"/></svg>',
  out: '<svg class="i" viewBox="0 0 24 24"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h11"/></svg>',
  globe: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>',
  copy: '<svg class="i" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>'
};

/* ---------- api ---------- */
async function call(action, body) {
  const res = await fetch(API, { method: 'POST', body: JSON.stringify(Object.assign({ action, key: KEY }, body || {})) });
  const j = await res.json();
  if (j && j.error === 'unauthorized') { const e = new Error('That team key isn’t right.'); e.auth = true; throw e; }
  if (j && j.error) throw new Error(j.error);
  return j;
}

/* ---------- effects ---------- */
function toast(m, bad) {
  const t = document.createElement('div'); t.className = 'toast' + (bad ? ' bad' : '');
  t.innerHTML = '<span class="ti">' + (bad ? I.x : I.check) + '</span><span>' + esc(m) + '</span>';
  $('#toasts').appendChild(t); setTimeout(() => { t.style.transition = 'opacity .3s,transform .3s'; t.style.opacity = 0; t.style.transform = 'translateY(8px)'; setTimeout(() => t.remove(), 300); }, 3400);
}
function burst(x, y) {
  const b = document.createElement('div'); b.className = 'burst'; b.style.left = x + 'px'; b.style.top = y + 'px';
  const cols = ['#0b5fd0', '#1d7cf2', '#5aa2ff', '#0f9d6b', '#34c38f', '#ffd166'];
  for (let i = 0; i < 26; i++) { const p = document.createElement('i'); const a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 110; p.style.background = cols[i % cols.length]; p.style.setProperty('--x', Math.cos(a) * d + 'px'); p.style.setProperty('--y', Math.sin(a) * d + 'px'); p.style.setProperty('--r', (Math.random() * 540 - 270) + 'deg'); p.style.animationDelay = (Math.random() * .08) + 's'; b.appendChild(p); }
  document.body.appendChild(b); setTimeout(() => b.remove(), 1100);
}
document.addEventListener('pointerdown', e => {
  const b = e.target.closest && e.target.closest('.btn'); if (!b) return;
  const r = b.getBoundingClientRect(), s = Math.max(r.width, r.height), rip = document.createElement('span');
  rip.className = 'rip'; rip.style.width = rip.style.height = s + 'px'; rip.style.left = (e.clientX - r.left - s / 2) + 'px'; rip.style.top = (e.clientY - r.top - s / 2) + 'px';
  b.appendChild(rip); setTimeout(() => rip.remove(), 600);
});
const orbSvg = '<svg viewBox="0 0 96 96"><defs><linearGradient id="og" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b5fd0"/><stop offset=".6" stop-color="#1d7cf2"/><stop offset="1" stop-color="#5aa2ff" stop-opacity="0"/></linearGradient></defs><circle cx="48" cy="48" r="44" fill="none" stroke="#e8eff9" stroke-width="5"/><circle cx="48" cy="48" r="44" fill="none" stroke="url(#og)" stroke-width="5" stroke-linecap="round" stroke-dasharray="190 400"/></svg>';
const orb = () => '<div class="orb"><div class="halo"></div>' + orbSvg + '<img src="' + MARK + '" alt=""><div class="tick"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div></div>';

/* The loading stage: shown for every action. Steps tick through while the work runs; a tick and a
   burst when it's done, a red cross and the reason if it isn't. Never shorter than ~0.9 s, so it reads. */
async function stage(title, steps, work, done) {
  const st = document.createElement('div'); st.className = 'stage';
  st.innerHTML = '<div class="box" role="status" aria-live="polite">' + orb() + '<h3>' + esc(title) + '</h3><p class="sub">' + esc(steps[0] || '') + '</p><div class="pb"><i></i></div><ul>' + steps.map(s => '<li><span class="s"></span>' + esc(s) + '</li>').join('') + '</ul></div>';
  document.body.appendChild(st);
  const lis = $$('li', st), bar = $('.pb i', st), sub = $('.sub', st);
  let i = 0, running = true;
  const advance = () => { lis.forEach((li, k) => li.className = k < i ? 'ok' : k === i ? 'on' : ''); bar.style.width = Math.min(92, ((i + .5) / steps.length) * 100) + '%'; if (steps[i]) sub.textContent = steps[i] + '…'; };
  advance();
  const timer = setInterval(() => { if (running && i < steps.length - 1) { i++; advance(); } }, Math.max(650, 2400 / Math.max(1, steps.length)));
  const t0 = Date.now();
  try {
    const out = await work();
    running = false; clearInterval(timer);
    if (Date.now() - t0 < 900) await sleep(900 - (Date.now() - t0));
    i = steps.length; advance(); bar.style.width = '100%';
    $('.orb', st).classList.add('done'); sub.textContent = done || 'Done';
    const r = $('.orb', st).getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2);
    await sleep(850);
    st.classList.add('out'); setTimeout(() => st.remove(), 400);
    return out;
  } catch (err) {
    running = false; clearInterval(timer);
    const o = $('.orb', st); o.classList.add('done', 'fail'); $('.tick', o).innerHTML = '<svg viewBox="0 0 24 24" style="stroke-dashoffset:0"><path d="M7 7l10 10M17 7 7 17"/></svg>';
    sub.textContent = err.message; sub.style.color = 'var(--bad)';
    lis.forEach((li, k) => { if (li.className === 'on') li.className = ''; });
    await sleep(1600);
    st.classList.add('out'); setTimeout(() => st.remove(), 400);
    if (err.auth) signOut();
    throw err;
  }
}

/* ---------- helpers ---------- */
const initials = s => String(s || '?').split(/[\s@.&]+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('');
const ago = t => { if (!t) return 'never signed in'; const d = (Date.now() - t) / 864e5; return d < 1 ? 'active today' : d < 2 ? 'active yesterday' : 'active ' + Math.round(d) + ' days ago'; };
const since = t => { if (!t) return ''; const m = (Date.now() - t) / 6e4; return m < 60 ? Math.max(1, Math.round(m)) + ' min ago' : m < 1440 ? Math.round(m / 60) + ' h ago' : Math.round(m / 1440) + ' days ago'; };
function logoHtml(c) {
  const inf = S.info[c.domain] || {};
  const own = inf.icon && !/google\.com\/s2\/favicons/.test(inf.icon) ? inf.icon : '';
  const src = inf.logo || own || inf.icon || '';
  return '<div class="logo' + (src ? ' ld' : '') + '" data-logo>' + (src ? '<img alt="" referrerpolicy="no-referrer" src="' + esc(src) + '" data-alt="' + esc(inf.logo && inf.logo !== src ? inf.logo : (inf.icon && inf.icon !== src ? inf.icon : '')) + '">' : '<span class="ini">' + esc(initials(c.name)) + '</span>') + '</div>';
}
function wireLogos(root) {
  $$('[data-logo] img', root).forEach(img => {
    const ok = () => { if (img.naturalWidth > img.naturalHeight * 1.5) img.parentElement.classList.add('wide'); img.classList.add('in'); img.parentElement.classList.remove('ld'); };
    const bad = () => { const alt = img.getAttribute('data-alt'); if (alt) { img.removeAttribute('data-alt'); img.src = alt; return; } const box = img.parentElement; box.classList.remove('ld'); box.innerHTML = '<span class="ini">' + esc(initials(box.closest('[data-d]') ? (S.clients.find(c => c.domain === box.closest('[data-d]').dataset.d) || {}).name : '')) + '</span>'; };
    if (img.complete && img.naturalWidth) ok(); else { img.addEventListener('load', ok); img.addEventListener('error', bad); }
  });
}
function scope(d, k) {
  const x = S.scopes && S.scopes.d && S.scopes.d[d];
  if (!x || !(k in x)) return 'unknown';
  const v = x[k];
  return typeof v === 'number' ? 'ok' : v === 'scope' ? 'missing' : 'error';
}
const missing = d => AREAS.filter(a => scope(d, a[0]) === 'missing').map(a => a[1]);
const usersOf = d => S.users.filter(u => (u.domains || []).indexOf(d) > -1);
function countUp(el, to) {
  const from = Number(el.dataset.v || 0); el.dataset.v = to;
  if (from === to) { el.textContent = to; return; }
  const t0 = performance.now(), dur = 700;
  const step = t => { const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3); el.textContent = Math.round(from + (to - from) * e); if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

/* ---------- sign in ---------- */
function signOut() { KEY = ''; try { sessionStorage.removeItem(KEYS); localStorage.removeItem(KEYS); } catch (e) {} signIn(); }
function signIn() {
  app.innerHTML = '<div class="splash"><form class="signbox"><div class="brand"><img src="' + MARK + '" alt=""><b>Easyleads</b></div>' +
    '<h2>Client console</h2><p>For the Easyleads team. Enter the team key to manage clients, their dashboards and their logins.</p>' +
    '<label class="f">Team key</label><input class="in" type="password" autocomplete="current-password" required autofocus>' +
    '<label style="display:flex;gap:9px;align-items:center;margin-top:14px;font-size:13px;color:var(--mute);cursor:pointer"><input type="checkbox"> Remember on this computer</label>' +
    '<div class="err" hidden></div><button class="btn pri" style="width:100%;margin-top:20px;padding:12px">' + I.key + 'Sign in</button></form></div>';
  const f = $('form', app);
  f.addEventListener('submit', async e => {
    e.preventDefault();
    const er = $('.err', f); er.hidden = true;
    KEY = $('input[type=password]', f).value.trim();
    try {
      const data = await stage('Signing you in', ['Checking the team key', 'Opening the console', 'Loading your clients'], () => fetchAll(), 'Welcome back');
      try { ($('input[type=checkbox]', f).checked ? localStorage : sessionStorage).setItem(KEYS, KEY); } catch (e2) {}
      shell(); apply(data);
    } catch (err) { KEY = ''; er.hidden = false; er.textContent = err.message; }
  });
}

/* ---------- console ---------- */
async function fetchAll() {
  const [a, b] = await Promise.all([call('portalAdminList'), call('elClients')]);
  return { a, b };
}
function apply(data) {
  S.users = data.a.users || []; S.scopes = data.a.scopes;
  const extra = {}; (data.b.clients || []).forEach(c => extra[c.domain] = c);
  S.clients = (data.a.clients || []).map(c => Object.assign({}, c, extra[c.domain] || {}));
  S.info = {}; S.clients.forEach(c => S.info[c.domain] = { logo: c.logo, icon: c.icon, site: c.site, sk: c.sk });
  draw();
  S.clients.filter(c => c.site).forEach(c => siteStatus(c.domain));
}
async function refresh() { apply(await fetchAll()); }
function shell() {
  app.innerHTML = '<div class="top"><a class="brand" href="#" data-home><img src="' + MARK + '" alt=""><b>Easyleads</b></a><div class="sub">Client console<small>Team only</small></div><div class="sp"></div>' +
    '<span class="live"><i></i>Live</span><button class="btn sm ghost" data-out>' + I.out + 'Sign out</button></div>' +
    '<main><div class="hero"><div><h1>Your <span>Easyleads</span> clients</h1><p>Connect an Easyleads account or a website once, then give each client a login to their own read-only dashboard.</p></div>' +
    '<div class="acts"><button class="btn pri" data-new>' + I.plus + 'New client</button><button class="btn" data-login>' + I.user + 'New login</button><button class="btn" data-copy>' + I.link + 'Copy login link</button><button class="btn" data-recheck>' + I.refresh + 'Re-check all</button></div></div>' +
    '<div class="stats" data-stats>' + ['Easyleads accounts', 'Website clients', 'Client logins', 'Active this week', 'Need data access'].map((l, k) => '<div class="stat' + (k === 4 ? ' warn' : '') + '"><div class="v" data-sv="' + k + '">0</div><div class="l">' + l + '</div></div>').join('') + '</div>' +
    '<div class="bar"><div class="search">' + I.search + '<input placeholder="Find a client by name or website" data-q></div><div class="seg" data-seg><span class="pill"></span><button data-f="all" class="on">All</button><button data-f="el">Easyleads</button><button data-f="site">Website</button><button data-f="nologin">No login</button><button data-f="access">Needs access</button></div></div>' +
    '<div class="grid" data-grid>' + '<div class="sk"></div>'.repeat(6) + '</div></main>';
  $('[data-out]').onclick = () => { toast('Signed out'); signOut(); };
  $('[data-home]').onclick = e => { e.preventDefault(); window.scrollTo({ top: 0 }); };
  $('[data-new]').onclick = () => clientForm();
  $('[data-login]').onclick = () => userForm(null);
  $('[data-copy]').onclick = () => navigator.clipboard.writeText(PORTAL).then(() => toast('Client login link copied'), () => toast(PORTAL));
  $('[data-recheck]').onclick = async () => {
    try { await stage('Re-checking every client', ['Reaching each Easyleads account', 'Reading forms, calls and contacts', 'Reading pipeline, bookings and email', 'Saving the results'], async () => { await call('portalAdminCheck'); await refresh(); }, 'Every client re-checked'); toast('Every client re-checked'); } catch (e) {}
  };
  $('[data-q]').oninput = e => { S.q = e.target.value.toLowerCase(); draw(); };
  const seg = $('[data-seg]'), pill = $('.pill', seg);
  const movePill = b => { pill.style.left = b.offsetLeft + 'px'; pill.style.width = b.offsetWidth + 'px'; };
  seg.onclick = e => { const b = e.target.closest('button'); if (!b) return; S.filter = b.dataset.f; $$('button', seg).forEach(x => x.classList.toggle('on', x === b)); movePill(b); draw(); };
  requestAnimationFrame(() => movePill($('button.on', seg)));
  window.addEventListener('resize', () => movePill($('button.on', seg)));
  document.addEventListener('click', e => { $$('.menu.open').forEach(m => { if (!m.contains(e.target)) m.classList.remove('open'); }); });
}
function draw() {
  const week = Date.now() - 7 * 864e5;
  const vals = [S.clients.filter(c => c.connected).length, S.clients.filter(c => c.site).length, S.users.length, S.users.filter(u => (u.lastSeen || u.lastLogin) > week).length, S.clients.filter(c => c.connected && missing(c.domain).length).length];
  vals.forEach((v, k) => { const el = $('[data-sv="' + k + '"]'); if (el) countUp(el, v); });
  let list = S.clients.slice();
  if (S.q) list = list.filter(c => (c.name + ' ' + c.domain).toLowerCase().indexOf(S.q) > -1);
  if (S.filter === 'el') list = list.filter(c => c.connected);
  if (S.filter === 'site') list = list.filter(c => c.site);
  if (S.filter === 'nologin') list = list.filter(c => !usersOf(c.domain).length);
  if (S.filter === 'access') list = list.filter(c => c.connected && missing(c.domain).length);
  const g = $('[data-grid]');
  if (!list.length) { g.innerHTML = '<div class="empty" style="grid-column:1/-1;text-align:center;padding:40px 0">' + (S.clients.length ? 'No clients match.' : 'No clients yet. Click “New client” to add the first one.') + '</div>'; return; }
  g.innerHTML = list.map((c, idx) => card(c, idx)).join('');
  wireLogos(g);
  $$('[data-more]', g).forEach(b => b.onclick = e => { e.stopPropagation(); const m = b.parentElement; $$('.menu.open').forEach(x => x !== m && x.classList.remove('open')); m.classList.toggle('open'); });
  $$('[data-x]', g).forEach(b => b.onclick = () => clientAct(b.dataset.x, S.clients.find(c => c.domain === b.closest('[data-d]').dataset.d)));
  $$('[data-ux]', g).forEach(b => b.onclick = () => userAct(b.dataset.ux, S.users.find(u => u.id === b.closest('[data-u]').dataset.u)));
}
function card(c, idx) {
  const us = usersOf(c.domain), miss = c.connected ? missing(c.domain) : [];
  const tag = c.connected ? (miss.length ? '<span class="tag warn"><i></i>Needs access</span>' : '<span class="tag el"><i></i>Easyleads</span>') : c.site ? '<span class="tag site"><i></i>Website</span>' : '<span class="tag no"><i></i>Not connected</span>';
  const chips = c.connected ? '<div class="chips">' + AREAS.map(a => { const s = scope(c.domain, a[0]); return '<span class="chip' + (s === 'missing' ? ' no' : s === 'error' ? ' err' : '') + '" title="' + (s === 'missing' ? 'The token needs this permission' : s === 'error' ? 'Easyleads didn’t answer last time' : s === 'unknown' ? 'Not checked yet' : 'Working') + '">' + (s === 'missing' ? I.x : I.check) + a[1] + '</span>'; }).join('') + '</div>'
    : c.site ? '<div class="chips"><span class="chip">' + I.check + 'Forms</span><span class="chip">' + I.check + 'Phone taps</span><span class="chip off">Pipeline</span><span class="chip off">Contacts</span><span class="chip off">Bookings</span><span class="chip off">Email</span></div>' : '';
  const st = S.site[c.domain];
  const snip = c.site ? '<div class="snip"><span class="dot ' + (st ? (st.last ? 'on' : 'wait') : '') + '"></span><span class="st">' + (st ? (st.last ? '<b>Snippet working</b> · last activity ' + since(st.last) + ' · ' + st.forms + ' leads, ' + st.taps + ' taps in 30 days' : '<b>Waiting for the first lead</b> · add the snippet to the website') : 'Checking the snippet…') + '</span><button class="link" data-x="snippet">' + I.code + 'Snippet</button></div>' : '';
  const menu = '<div class="menu"><button class="btn sm ghost" data-more aria-label="More">' + I.dots + '</button><div class="dd">' +
    (c.connected ? '<button data-x="recheck">' + I.refresh + 'Re-check access</button><button data-x="reconnect">' + I.key + 'Replace Location ID / token</button>' : '') +
    (c.site ? '<button data-x="snippet">' + I.code + 'Get the snippet</button>' : '') +
    '<button data-x="logo">' + I.img + 'Find the logo again</button><button data-x="logourl">' + I.edit + 'Use my own logo</button><button data-x="rename">' + I.edit + 'Rename</button><hr><button data-x="remove" class="bad">' + I.trash + 'Remove client</button></div></div>';
  return '<div class="card' + (c.site ? ' site' : '') + '" data-d="' + esc(c.domain) + '" style="animation-delay:' + Math.min(idx, 14) * 45 + 'ms"><div class="ch">' + logoHtml(c) + '<div class="nm"><h3 title="' + esc(c.name) + '">' + esc(c.name) + '</h3><div class="dm">' + I.globe + '<a href="https://' + esc(c.domain) + '" target="_blank" rel="noopener">' + esc(c.domain) + '</a></div></div>' + tag + menu + '</div>' +
    chips + snip +
    '<div class="row"><button class="tog' + (c.bot ? ' on' : '') + '" data-x="bot"><i></i>Assistant ' + (c.bot ? 'on' : 'off') + '</button>' + (c.bot ? '<button class="link" data-x="chats">' + I.chat + 'Read chats</button>' : '') + '</div>' +
    '<div class="users">' + (us.length ? us.map(u => '<div class="user' + (u.disabled ? ' off' : '') + '" data-u="' + esc(u.id) + '"><div class="av">' + esc(initials(u.name || u.email)) + '</div><div class="who"><b>' + esc(u.name || u.email) + (u.disabled ? ' · off' : '') + '</b><small>' + esc(u.email) + ' · ' + ago(u.lastSeen || u.lastLogin) + '</small></div>' +
      '<button class="btn sm" data-ux="as" title="Open the dashboard as this client">' + I.eye + 'Open</button><div class="menu"><button class="btn sm ghost" data-more>' + I.dots + '</button><div class="dd"><button data-ux="edit">' + I.edit + 'Edit login</button><button data-ux="toggle">' + I.power + (u.disabled ? 'Turn back on' : 'Turn off') + '</button><button data-ux="signout">' + I.out + 'Sign out everywhere</button><hr><button data-ux="del" class="bad">' + I.trash + 'Delete login</button></div></div></div>').join('') : '<div class="empty">No login yet.</div>') + '</div>' +
    '<div class="row foot"><button class="btn pri sm" data-x="login">' + I.plus + 'Create login</button></div></div>';
}
async function siteStatus(d) {
  try { S.site[d] = await call('elSiteCheck', { domain: d }); } catch (e) { S.site[d] = { forms: 0, taps: 0, last: 0 }; }
  const el = $('[data-d="' + CSS.escape(d) + '"] .snip');
  if (el) { const c = S.clients.find(x => x.domain === d); const tmp = document.createElement('div'); tmp.innerHTML = card(c, 0); const n = $('.snip', tmp); el.replaceWith(n); $$('[data-x]', n).forEach(b => b.onclick = () => clientAct(b.dataset.x, c)); }
}

/* ---------- modals ---------- */
function modal(html, wide) {
  const b = document.createElement('div'); b.className = 'back';
  b.innerHTML = '<div class="modal' + (wide ? ' wide' : '') + '" role="dialog" aria-modal="true">' + html + '</div>';
  document.body.appendChild(b);
  const close = () => { b.style.transition = 'opacity .2s'; b.style.opacity = 0; setTimeout(() => b.remove(), 200); document.removeEventListener('keydown', k); };
  const k = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', k);
  b.addEventListener('mousedown', e => { if (e.target === b) close(); });
  $$('[data-close]', b).forEach(x => x.onclick = close);
  setTimeout(() => { const f = $('input:not([type=checkbox]):not([readonly])', b); if (f) f.focus(); }, 60);
  return { el: b, close };
}
function confirmBox(title, text, okText) {
  return new Promise(res => {
    const m = modal('<h2>' + esc(title) + '</h2><p class="s">' + esc(text) + '</p><div class="mf"><button class="btn" data-no>Cancel</button><button class="btn pri" data-ok style="background:linear-gradient(120deg,#c22d3c,#e04b5a)">' + esc(okText) + '</button></div>');
    $('[data-ok]', m.el).onclick = () => { m.close(); res(true); };
    $('[data-no]', m.el).onclick = () => { m.close(); res(false); };
  });
}
function snippetFor(c) { return '<script src="' + SNIPPET_SRC + '" data-site="' + c.domain + '" data-key="' + (c.sk || (S.info[c.domain] || {}).sk) + '" async><\/script>'; }
function showSnippet(c) {
  const code = snippetFor(c);
  const m = modal('<h2>Website snippet · ' + esc(c.name) + '</h2><p class="s">Paste this once on every page of <b>' + esc(c.domain) + '</b>, just before <code>&lt;/body&gt;</code>. Form submissions and taps on phone numbers then appear on their dashboard within a minute.</p>' +
    '<div class="code" data-code>' + esc(code) + '<button class="btn sm" data-cp>' + I.copy + 'Copy</button></div>' +
    '<ul class="steps"><li><b>1</b><span><b>WordPress:</b> a header &amp; footer plugin (e.g. WPCode) → Footer, or your theme’s footer.</span></li><li><b>2</b><span><b>Concrete CMS:</b> Dashboard → System &amp; Settings → SEO &amp; Statistics → Tracking Codes → Footer.</span></li><li><b>3</b><span><b>Wix / Squarespace / Shopify:</b> Settings → Custom code → Body end, all pages.</span></li><li><b>4</b><span>Submit a test form on the site; the card turns green with the time of the first lead.</span></li></ul>' +
    '<div class="note">Captured: what visitors type into contact forms (never passwords or payment fields) and taps on phone numbers, with where they came from. Mention website forms in the client’s privacy policy.</div>' +
    '<div class="mf"><button class="btn" data-close>Done</button></div>', true);
  $('[data-cp]', m.el).onclick = e => navigator.clipboard.writeText(code).then(() => { toast('Snippet copied'); const r = e.target.getBoundingClientRect(); burst(r.left + r.width / 2, r.top); });
}

/* New client: an Easyleads account, or a website with the snippet. */
function clientForm(c) {
  const edit = !!c;
  let kind = 'el';
  const m = modal('<h2>' + (edit ? 'Replace connection' : 'New client') + '</h2><p class="s">' + (edit ? 'Paste a new Location ID and Private Integration token for ' + esc(c.name) + '.' : 'Choose how their leads reach the dashboard. The logo is found automatically.') + '</p>' +
    (edit ? '' : '<div class="tabs" data-tabs><button type="button" class="on" data-k="el"><b>Easyleads account</b><small>Forms, calls, contacts, pipeline, bookings, email</small></button><button type="button" data-k="site"><b>Website only</b><small>A snippet: form leads and phone taps</small></button></div>') +
    '<form><label class="f">Client name</label><input class="in" name="name" required value="' + esc(c ? c.name : '') + '"' + (edit ? ' readonly' : '') + '>' +
    '<label class="f">Website <small>for example example.com</small></label><input class="in" name="domain" required value="' + esc(c ? c.domain : '') + '"' + (edit ? ' readonly' : '') + '>' +
    '<div data-el><label class="f">Location ID <small>Easyleads → Settings → Business Profile</small></label><input class="in" name="loc" autocomplete="off">' +
    '<label class="f">Private Integration token <small>Settings → Private Integrations → Create new</small></label><input class="in" name="tok" type="password" autocomplete="off">' +
    '<div class="note">Give the token these read-only permissions: View Forms, View Custom Fields, View Contacts, View Conversation Messages, View Opportunities, View Calendars, View Calendar Events.</div></div>' +
    '<div data-site hidden><div class="note">You’ll get a one-line snippet to paste on their website. No Easyleads account needed.</div></div>' +
    '<div class="err" hidden></div><div class="mf"><button type="button" class="btn" data-close>Cancel</button><button class="btn pri" data-go>' + (edit ? 'Save connection' : 'Connect client') + '</button></div></form>');
  const f = $('form', m.el);
  const setKind = k => { kind = k; $$('[data-tabs] button', m.el).forEach(b => b.classList.toggle('on', b.dataset.k === k)); $('[data-el]', f).hidden = k !== 'el'; $('[data-site]', f).hidden = k !== 'site'; $('[data-go]', f).innerHTML = k === 'site' ? 'Create website client' : (edit ? 'Save connection' : 'Connect client'); };
  $$('[data-tabs] button', m.el).forEach(b => b.onclick = () => setKind(b.dataset.k));
  f.onsubmit = async e => {
    e.preventDefault();
    const er = $('.err', f), v = Object.fromEntries(new FormData(f)); er.hidden = true;
    if (kind === 'el' && (!v.loc || !v.tok)) { er.hidden = false; er.textContent = 'Both the Location ID and the token are needed.'; return; }
    m.close();
    try {
      let j;
      if (kind === 'site') {
        j = await stage('Adding ' + (v.name || 'the client'), ['Saving the website client', 'Finding their logo', 'Creating their snippet code', 'Getting the dashboard ready'], async () => { const r = await call('elAddSiteClient', v); await refresh(); return r; }, 'Website client ready');
        const nc = S.clients.find(x => x.domain === j.domain); if (nc) showSnippet(nc);
      } else {
        j = await stage(edit ? 'Replacing the connection' : 'Connecting ' + (v.name || 'the client'), ['Reaching their Easyleads account', 'Checking each permission', 'Finding their logo', 'Saving securely', 'Getting the dashboard ready'], async () => { const r = await call('elAddClient', v); await refresh(); return r; }, edit ? 'Connection replaced' : 'Client connected');
        if (j.missing && j.missing.length) toast('Connected. The token still needs: ' + j.missing.join(', '), 1); else toast(edit ? 'Connection replaced' : 'Client connected');
        if (!edit) { const nc = S.clients.find(x => x.domain === j.domain); if (nc && !usersOf(nc.domain).length) userForm(null, nc.domain); }
      }
    } catch (err) { /* the stage showed why */ }
  };
}

function genPw() { const a = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'; const r = new Uint32Array(16); crypto.getRandomValues(r); return [...r].map(n => a[n % a.length]).join(''); }
function userForm(u, domain) {
  const doms = u ? u.domains || [] : (domain ? [domain] : []);
  const m = modal('<h2>' + (u ? 'Edit login' : 'New client login') + '</h2><p class="s">' + (u ? esc(u.email) : 'The client signs in at the client login link with this email and password.') + '</p><form>' +
    '<label class="f">Name</label><input class="in" name="name" value="' + esc(u ? u.name : '') + '">' +
    '<label class="f">Email</label><input class="in" name="email" type="email" required value="' + esc(u ? u.email : '') + '">' +
    '<label class="f">' + (u ? 'New password <small>leave empty to keep the current one</small>' : 'Password <small>at least 12 characters</small>') + '</label><div class="row" style="flex-wrap:nowrap"><input class="in" name="password" type="text" autocomplete="new-password"' + (u ? '' : ' required') + '><button type="button" class="btn sm" data-gen>' + I.refresh + 'Generate</button></div>' +
    '<label class="f">Dashboards this login can see</label><div class="checks">' + S.clients.map(c => '<label><input type="checkbox" name="d" value="' + esc(c.domain) + '"' + (doms.indexOf(c.domain) > -1 ? ' checked' : '') + '> ' + esc(c.name) + '</label>').join('') + '</div>' +
    '<label style="display:flex;gap:9px;align-items:center;margin-top:14px;font-size:13px;cursor:pointer"><input type="checkbox" name="canEdit"' + (u && u.locked ? '' : ' checked') + '> The client can rearrange their own dashboard</label>' +
    '<div class="err" hidden></div><div class="mf"><button type="button" class="btn" data-close>Cancel</button><button class="btn pri">' + (u ? 'Save login' : 'Create login') + '</button></div></form>');
  const f = $('form', m.el);
  $('[data-gen]', f).onclick = () => { f.password.value = genPw(); };
  if (!u) f.password.value = genPw();
  f.onsubmit = async e => {
    e.preventDefault();
    const er = $('.err', f);
    const body = { id: u ? u.id : undefined, name: f.name.value.trim(), email: f.email.value.trim(), domains: $$('input[name=d]:checked', f).map(x => x.value), locked: !f.canEdit.checked, disabled: u ? !!u.disabled : false };
    if (f.password.value) body.password = f.password.value;
    if (!body.domains.length) { er.hidden = false; er.textContent = 'Pick at least one dashboard.'; return; }
    if (body.password && body.password.length < 12) { er.hidden = false; er.textContent = 'Use a password of at least 12 characters.'; return; }
    m.close();
    try {
      await stage(u ? 'Saving the login' : 'Creating the login', u ? ['Updating the account', 'Applying dashboard access', 'Saving'] : ['Creating the account', 'Securing the password', 'Giving dashboard access', 'Warming up their data'], async () => { await call('portalAdminSave', body); await refresh(); }, u ? 'Login saved' : 'Login ready');
      if (body.password) {
        const share = 'Your Easyleads dashboard\n' + PORTAL + '\nEmail: ' + body.email + '\nPassword: ' + body.password;
        const s = modal('<h2>Login ready</h2><p class="s">Send these to the client. The password isn’t shown again.</p><div class="share">' + esc(share) + '</div><div class="mf"><button class="btn" data-close>Done</button><button class="btn pri" data-cp>' + I.copy + 'Copy</button></div>');
        $('[data-cp]', s.el).onclick = e2 => navigator.clipboard.writeText(share).then(() => { toast('Copied'); const r = e2.currentTarget.getBoundingClientRect(); burst(r.left + r.width / 2, r.top); });
      } else toast('Login saved');
    } catch (err) {}
  };
}

async function clientAct(a, c) {
  if (!c) return;
  $$('.menu.open').forEach(x => x.classList.remove('open'));
  try {
    if (a === 'login') return userForm(null, c.domain);
    if (a === 'reconnect') return clientForm(c);
    if (a === 'snippet') return showSnippet(c);
    if (a === 'bot') {
      await stage(c.bot ? 'Turning the assistant off' : 'Turning the assistant on', c.bot ? ['Updating ' + c.name, 'Saving'] : ['Updating ' + c.name, 'Preparing their dashboard data', 'Saving'], async () => { await call('portalAdminBot', { domain: c.domain, on: !c.bot }); await refresh(); }, 'Assistant ' + (c.bot ? 'off' : 'on'));
      return toast('Assistant ' + (c.bot ? 'off' : 'on') + ' for ' + c.name);
    }
    if (a === 'recheck') { await stage('Re-checking ' + c.name, ['Reaching their Easyleads account', 'Testing each permission', 'Saving the results'], async () => { await call('portalAdminCheck', { domain: c.domain }); await refresh(); }, c.name + ' re-checked'); return toast(c.name + ' re-checked'); }
    if (a === 'logo') { await stage('Finding ' + c.name + '’s logo', ['Visiting ' + c.domain, 'Looking for their icon and logo', 'Checking the images load', 'Saving'], async () => { await call('elLogo', { domain: c.domain }); await refresh(); }, 'Logo updated'); return toast('Logo updated'); }
    if (a === 'logourl') {
      const m = modal('<h2>Use my own logo</h2><p class="s">Paste the address of an image (PNG, JPG, SVG or WebP) for ' + esc(c.name) + '.</p><form><label class="f">Image address</label><input class="in" name="u" placeholder="https://…/logo.png" required><div class="err" hidden></div><div class="mf"><button type="button" class="btn" data-close>Cancel</button><button class="btn pri">Use this logo</button></div></form>');
      $('form', m.el).onsubmit = async e => { e.preventDefault(); const u = e.target.u.value.trim(); m.close(); try { await stage('Setting the logo', ['Checking the image', 'Saving'], async () => { await call('elLogo', { domain: c.domain, url: u }); await refresh(); }, 'Logo updated'); toast('Logo updated'); } catch (err) {} };
      return;
    }
    if (a === 'rename') {
      const m = modal('<h2>Rename client</h2><form><label class="f">Name</label><input class="in" name="n" value="' + esc(c.name) + '" required><div class="mf"><button type="button" class="btn" data-close>Cancel</button><button class="btn pri">Save</button></div></form>');
      $('form', m.el).onsubmit = async e => { e.preventDefault(); const n = e.target.n.value; m.close(); try { await stage('Renaming', ['Saving the new name'], async () => { await call('elRenameClient', { domain: c.domain, name: n }); await refresh(); }, 'Renamed'); toast('Renamed'); } catch (err) {} };
      return;
    }
    if (a === 'remove') {
      if (!await confirmBox('Remove ' + c.name + '?', 'Their connection is deleted from the console. Logins stay, but their dashboard shows nothing until the client is added again.', 'Remove client')) return;
      await stage('Removing ' + c.name, ['Deleting the connection', 'Updating the client list'], async () => { await call('elRemoveClient', { domain: c.domain }); await refresh(); }, c.name + ' removed');
      return toast(c.name + ' removed');
    }
    if (a === 'chats') {
      const m = modal('<h2>Assistant chats · ' + esc(c.name) + '</h2><p class="s">Newest first.</p><div data-c><div class="boot" style="padding:30px 0">' + orb() + '<span>Loading the conversations…</span></div></div><div class="mf"><button class="btn" data-close>Close</button></div>', true);
      const j = await call('portalAdminChats', { domain: c.domain });
      const rows = (j.rows || []).slice().reverse();
      $('[data-c]', m.el).innerHTML = rows.length ? rows.map(r => '<div class="chat"><small>' + esc(new Date(r.t).toLocaleString('en-CA')) + ' · ' + esc(r.name || r.email) + (r.as === 'Team' || r.as === 'EDGE' ? ' · viewed by the team' : '') + '</small><div class="q">' + esc(r.q) + '</div><div class="a">' + esc(r.a) + '</div></div>').join('') : '<div class="empty">No chats yet.</div>';
    }
  } catch (err) { if (a === 'chats') toast(err.message, 1); }
}
async function userAct(a, u) {
  if (!u) return;
  $$('.menu.open').forEach(x => x.classList.remove('open'));
  try {
    if (a === 'edit') return userForm(u);
    if (a === 'as') {
      const w = window.open('about:blank', '_blank');
      const j = await stage('Opening ' + (u.name || u.email) + '’s dashboard', ['Creating a secure team session', 'Opening their dashboard'], () => call('portalAdminSession', { id: u.id }), 'Opening now');
      const url = PORTAL + '#s=' + encodeURIComponent(j.session);
      if (w) w.location = url; else location.href = url;
      return;
    }
    const base = { id: u.id, name: u.name, email: u.email, domains: u.domains, disabled: !!u.disabled };
    if (a === 'toggle') { await stage(u.disabled ? 'Turning the login back on' : 'Turning the login off', u.disabled ? ['Updating the account', 'Saving'] : ['Updating the account', 'Signing them out everywhere', 'Saving'], async () => { await call('portalAdminSave', Object.assign(base, { disabled: !u.disabled, signOut: !u.disabled })); await refresh(); }, u.disabled ? 'Login on' : 'Login off'); return toast(u.disabled ? 'Login turned back on' : 'Login turned off'); }
    if (a === 'signout') { await stage('Signing out everywhere', ['Ending every session', 'Saving'], () => call('portalAdminSave', Object.assign(base, { signOut: true })), 'Signed out everywhere'); return toast('Signed out on every device'); }
    if (a === 'del') {
      if (!await confirmBox('Delete ' + (u.name || u.email) + '?', 'They can’t sign in again and their own dashboard layout is deleted. This can’t be undone.', 'Delete login')) return;
      await stage('Deleting the login', ['Removing the account', 'Removing their dashboard layout', 'Saving'], async () => { await call('portalAdminDelete', { id: u.id }); await refresh(); }, 'Login deleted');
      return toast('Login deleted');
    }
  } catch (err) {}
}

/* ---------- start ---------- */
if (!API) { app.innerHTML = '<div class="splash"><div class="signbox">This console isn’t set up yet.</div></div>'; return; }
if (!KEY) { signIn(); return; }
app.innerHTML = '<div class="splash"><div class="boot">' + orb() + '<span>Loading your clients…</span></div></div>';
fetchAll().then(d => { shell(); apply(d); }).catch(err => { if (err.auth) signOut(); else { signIn(); const er = $('.err'); if (er) { er.hidden = false; er.textContent = err.message; } } });
})();
</script>
</body>
</html>
